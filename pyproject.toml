[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daft-qdrant"
version = "0.2.0"
description = "Qdrant community extension for Daft"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["daft", "qdrant", "vector-database", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "daft>=0.3.0",
    "qdrant-client<2.0.0",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Eventual-Inc/Daft"
Documentation = "https://docs.daft.ai"
Issues = "https://github.com/Eventual-Inc/Daft/issues"

[tool.setuptools.packages.find]
include = ["daft_qdrant*"]

